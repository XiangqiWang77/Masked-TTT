[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masked-selective-ttt"
version = "0.2.0"
description = "Chunk-guided selective self-distillation into request-local KV reading state"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.8,<2.10", "transformers==4.57.6", "accelerate>=1.0,<2"]

[project.optional-dependencies]
cuda = ["flash-attn>=2.7,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
masked-ttt = "masked_ttt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
